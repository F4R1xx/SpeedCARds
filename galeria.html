<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedCards - Seleção de Marcas</title>
    <link rel="icon" href="./assets/icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --background-dark: #0A0A0A;
            --background-light: #1A1A1A;
            --primary-red: #E01A4F;
            --primary-red-dark: #c01040;
            --text-light: #f0f2f5;
            --text-medium: #a0aec0;
            --border-color: rgba(255, 255, 255, 0.1);
            --font-body: 'Inter', sans-serif;
            --font-display: 'Orbitron', sans-serif;
            --glow-effect: 0 0 15px rgba(224, 26, 79, 0.7);
            --glass-bg: rgba(26, 26, 26, 0.6);
            --glass-border: 1px solid rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: var(--font-body);
            background-color: var(--background-dark);
            background-image: radial-gradient(circle at top right, rgba(224, 26, 79, 0.1), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(224, 26, 79, 0.05), transparent 40%);
            color: var(--text-light);
            overflow-x: hidden;
            min-height: 100vh;
        }

        .font-orbitron { font-family: var(--font-display); }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: var(--glass-border);
            border-radius: 1rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .loader-container { background: var(--background-dark); }
        .loader {
            border-top-color: var(--primary-red);
            border-right-color: var(--primary-red);
            border-bottom-color: var(--primary-red);
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- NOVOS BOTÕES DE MARCA --- */
        .manufacturer-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            text-decoration: none;
            cursor: pointer;
            height: 100%;
            min-height: 160px;
        }

        .manufacturer-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.03), transparent);
            transform: translateY(100%);
            transition: transform 0.6s ease;
        }

        .manufacturer-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(224, 26, 79, 0.5);
            box-shadow: 0 10px 30px -10px rgba(224, 26, 79, 0.3);
        }

        .manufacturer-card:hover::before {
            transform: translateY(-100%);
        }

        .manufacturer-logo {
            max-width: 100px;
            max-height: 60px;
            width: auto;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)) grayscale(30%);
            transition: all 0.3s ease;
        }

        .manufacturer-card:hover .manufacturer-logo {
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.4)) grayscale(0%);
            transform: scale(1.1);
        }

        .manufacturer-name {
            color: var(--text-light);
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* Badge de coleção completa */
        .completed-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(52, 152, 219, 0.2);
            border: 1px solid rgba(52, 152, 219, 0.5);
            color: #63b3ed;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 999px;
            font-weight: 600;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.2);
        }
        
        .manufacturer-card.completed {
            border-color: rgba(52, 152, 219, 0.4);
            box-shadow: 0 0 20px rgba(52, 152, 219, 0.15) inset;
        }

        /* Botão Principal */
        .all-cars-btn {
            position: relative;
            background: linear-gradient(90deg, var(--primary-red), var(--primary-red-dark));
            color: white;
            padding: 1rem 2.5rem;
            border-radius: 0.5rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(224, 26, 79, 0.4);
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .all-cars-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(224, 26, 79, 0.7);
        }

        /* Decoração de fundo */
        .bg-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.15;
            pointer-events: none;
        }
    </style>
</head>
<body class="text-white">

    <div id="loader" class="loader-container fixed inset-0 flex flex-col items-center justify-center z-50">
        <div class="loader ease-linear rounded-full border-8 border-t-8 border-gray-600 h-28 w-28"></div>
        <p class="mt-8 text-2xl font-orbitron text-red-400 animate-pulse">Iniciando Sistemas...</p>
    </div>

    <div id="app-container" class="hidden w-full min-h-screen flex flex-col relative z-10">
        <!-- Luzes de fundo -->
        <div class="bg-glow bg-red-600 w-96 h-96 top-0 left-0"></div>
        <div class="bg-glow bg-blue-600 w-96 h-96 bottom-0 right-0"></div>

        <header id="header-placeholder" class="sticky top-0 z-40 w-full"></header>
        
        <main class="flex-grow container mx-auto px-4 sm:px-6 lg:px-8 py-12">
            <div class="glass-panel p-6 sm:p-10 relative overflow-hidden">
                
                <!-- Cabeçalho da Página -->
                <div class="flex flex-col lg:flex-row justify-between items-center mb-12 gap-8 border-b border-gray-800 pb-8">
                    <div class="text-center lg:text-left">
                        <h1 class="font-orbitron text-4xl md:text-6xl font-black text-white mb-2" style="text-shadow: 0 0 20px rgba(255,255,255,0.3);">
                            GARAGEM
                        </h1>
                        <p class="text-gray-400 font-orbitron tracking-widest text-sm uppercase">Selecione uma montadora para explorar</p>
                    </div>
                    
                    <a href="manufacturer_gallery.html" class="all-cars-btn font-orbitron group flex items-center gap-3">
                        <span>Ver Garagem Completa</span>
                        <span class="group-hover:translate-x-1 transition-transform">→</span>
                    </a>
                </div>
                
                <!-- Grid de Montadoras -->
                <section>
                    <div id="manufacturers-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 sm:gap-6">
                        <!-- Cards injetados via JS -->
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script type="module">
        import { auth, db } from './firebase.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { ref, get } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";
        import { cards, manufacturers } from './cards.js'; 
        import { createHeader } from './menu.js'; 

        const loader = document.getElementById('loader');
        const appContainer = document.getElementById('app-container');
        const manufacturersContainer = document.getElementById('manufacturers-container');
        const headerPlaceholder = document.getElementById('header-placeholder');

        function renderManufacturers(userOwnedCardIds) {
            manufacturersContainer.innerHTML = '';
            const uniqueManufacturers = Object.keys(manufacturers).sort();

            uniqueManufacturers.forEach(name => {
                const button = document.createElement('a');
                button.href = `manufacturer_gallery.html?manufacturer=${encodeURIComponent(name)}`;
                
                // Cálculos de coleção
                const carsOfManufacturer = Object.values(manufacturers[name]);
                const totalCars = carsOfManufacturer.length;
                const ownedCarsCount = carsOfManufacturer.filter(carData => {
                    // Encontrar ID da carta baseada no objeto
                    const cardId = Object.keys(cards).find(key => cards[key] === carData);
                    return userOwnedCardIds.includes(cardId);
                }).length;
                
                const isCompleted = (totalCars > 0 && ownedCarsCount === totalCars);
                
                // Classes dinâmicas
                button.className = `manufacturer-card font-orbitron ${isCompleted ? 'completed' : ''}`;
                
                // HTML Interno
                let badgeHtml = isCompleted ? '<div class="completed-badge">✓ FULL</div>' : '';
                
                // Tratamento de nome de arquivo de imagem (remove espaços)
                const logoFilename = name.replace(/\s/g, '') + '-Logo.png';

                button.innerHTML = `
                    ${badgeHtml}
                    <div class="h-16 flex items-center justify-center w-full">
                        <img src="./assets/${logoFilename}" alt="${name}" class="manufacturer-logo" onerror="this.style.display='none'">
                    </div>
                    <span class="manufacturer-name">${name.toUpperCase()}</span>
                `;
                
                manufacturersContainer.appendChild(button);
            });
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const snapshot = await get(ref(db, 'users/' + user.uid));
                    if (snapshot.exists()) {
                        const userData = snapshot.val();
                        createHeader(auth, userData, headerPlaceholder, 'galeria');
                        renderManufacturers(userData.cartas || []); 
                        appContainer.classList.remove('hidden');
                        loader.classList.add('hidden');
                    } else { 
                         // Fallback gracioso se não houver dados, não desloga forçado
                        console.warn("Sem dados de usuário, carregando interface básica.");
                        createHeader(auth, {}, headerPlaceholder, 'galeria');
                        renderManufacturers([]);
                        appContainer.classList.remove('hidden');
                        loader.classList.add('hidden');
                    }
                } catch (error) {
                    console.error("Erro ao buscar dados:", error);
                    alert("Erro de conexão. Verifique o console.");
                    loader.classList.add('hidden');
                }
            } else { window.location.href = 'index.html'; }
        });
    </script>
</body>
</html>
